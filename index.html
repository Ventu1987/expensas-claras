<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expensas Claras — Liquidación de expensas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef;--surface:#ffffff;--surface2:#faf9f6;--ink:#1b1d21;--mute:#676b73;--line:#e4e2dc;--line2:#d6d3cb;
  --acc:#1f5f8b;--accSoft:#e7eff6;--accInk:#ffffff;
  --bad:#b3261e;--badSoft:#fbeceb;--ok:#2b7a4b;--okSoft:#e8f3ec;--warn:#97590a;--warnSoft:#fcf0de;
  --help:#fff8e1;--helpLine:#f0dca0;--helpInk:#5c4a12;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 14px rgba(20,20,20,.04);
  --r:10px;--c1:#2a6f9e;--c2:#c27a1a;
}
body.dark{
  --bg:#23272d;--surface:#2b3037;--surface2:#323840;--ink:#eceef1;--mute:#a9b0b9;--line:#3d444e;--line2:#4b535e;
  --acc:#7ab4e0;--accSoft:#2f4356;--accInk:#13202c;
  --bad:#f59b91;--badSoft:#4a2b29;--ok:#86cfa3;--okSoft:#24402f;--warn:#ecbd6e;--warnSoft:#4a3a20;
  --help:#3a3523;--helpLine:#5e5430;--helpInk:#f0e3b3;
  --c1:#4a94cf;--c2:#c4831f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:var(--accInk);font-weight:700}
.brand b{font-size:15px;display:block}.brand span{font-size:11.5px;color:var(--mute)}
.side-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:0 8px;margin-bottom:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:13.5px}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accSoft);color:var(--acc);font-weight:600}
.nav a svg{width:17px;height:17px;flex:none;opacity:.8}
.nav a .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.barrio-pick{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
/* Main */
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0}.top .sub{color:var(--mute);font-size:12.5px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--mute);background:var(--surface2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}.chip.ok .dot{background:var(--ok)}.chip.bad .dot{background:var(--bad)}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--line2)}.tbtn.on{background:var(--help);border-color:var(--helpLine);color:var(--helpInk)}
.tbtn svg{width:16px;height:16px}
.content{padding:24px 28px 60px;max-width:1360px;width:100%}
/* Cards & tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .lead{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}.card-h>div:first-child{flex:1}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--mute);font-weight:600;background:var(--surface2);position:sticky;top:0;z-index:1;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:8px}
.tw table th:first-child,.tw table td:first-child{padding-left:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accSoft);border-color:var(--acc)}
input.n{text-align:right;font-variant-numeric:tabular-nums;min-width:96px}
.obs{border-color:transparent;background:transparent;min-width:300px;resize:none;font-size:12.5px;line-height:1.4;padding:4px 6px;overflow:hidden;display:block}.obs:hover,.obs:focus{border-color:var(--line);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--acc);background:var(--acc);color:var(--accInk);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn.sec{background:var(--surface);color:var(--acc)}.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.btn.danger{border-color:var(--bad);background:var(--surface);color:var(--bad)}
.btn svg{width:15px;height:15px}
.x{border:none;background:none;color:var(--mute);cursor:pointer;font-size:17px;padding:2px 6px;border-radius:6px}.x:hover{color:var(--bad);background:var(--badSoft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:14px}
.up{color:var(--bad)}.down{color:var(--ok)}.muted{color:var(--mute)}
.neg,.neg b{color:var(--bad)}.neg .up{color:var(--bad)}.neg .down{color:var(--ok)}input.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .t{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi.alert{border-color:var(--bad);background:var(--badSoft)}
.st{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.st.ok{background:var(--okSoft);color:var(--ok)}.st.bad{background:var(--badSoft);color:var(--bad)}.st.warn{background:var(--warnSoft);color:var(--warn)}.st.info{background:var(--accSoft);color:var(--acc)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--accSoft);color:var(--acc)}.tag.b{background:var(--warnSoft);color:var(--warn)}
tr.cur td{background:var(--accSoft)}
/* Doña Rosa */
.help{display:none;background:var(--help);border:1px solid var(--helpLine);color:var(--helpInk);border-radius:8px;padding:10px 12px;font-size:13px;margin:4px 0 12px}
.help b{font-weight:700}
body.dona .help{display:block}
.qi{display:none;width:15px;height:15px;border-radius:50%;background:var(--help);border:1px solid var(--helpLine);color:var(--helpInk);font-size:10px;font-weight:700;align-items:center;justify-content:center;cursor:help}
body.dona .qi{display:inline-flex}
/* Barrios home */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.bcard:hover{border-color:var(--acc)}
.bcard h3{margin:0 0 2px;font-size:16px}.bcard .meta{color:var(--mute);font-size:12px;margin-bottom:12px}
.bcard .m{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard .m div span{display:block;font-size:11.5px;color:var(--mute)}.bcard .m div b{font-variant-numeric:tabular-nums}
.bcard.new svg{width:20px;height:20px}.bcard.new{display:grid;place-items:center;border-style:dashed;color:var(--acc);font-weight:600;min-height:170px}
/* Bars */
.bars .br{display:grid;grid-template-columns:minmax(150px,210px) 1fr 118px 64px;gap:12px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}.bars .br:last-child{border-bottom:none}.bars.narrow .br{grid-template-columns:64px minmax(60px,1fr) 108px 54px}.bars .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}.bars .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;white-space:nowrap}
.bars .track{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bars .fill{height:100%;background:var(--c1);border-radius:6px}.bars .fill.b{background:var(--c2)}.bars .fill.neg{background:var(--bad)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
/* Charts */
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin:0 0 6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}.chart text{fill:var(--mute);font-size:11px;font-family:inherit}.chart .val{fill:var(--ink);font-weight:600}
.chart .bA{fill:var(--c1)}.chart .bB{fill:var(--c2)}.chart .grid{stroke:var(--line)}.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:var(--surface2);opacity:.5}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;pointer-events:none;display:none;max-width:280px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.ind td{padding:8px 6px}.ind td:first-child{color:var(--mute)}.ind td.n{font-weight:600}
.pop{position:fixed;z-index:80;background:var(--help);border:1px solid var(--helpLine);color:var(--helpInk);padding:10px 12px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;line-height:1.45}
/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(560px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:420px}.toast.on{opacity:1}
.recibo{max-width:640px}
.print-head{display:none}
#print-root{display:none}
.mob-nav{display:none}
@media (max-width:980px){.bars .br{grid-template-columns:110px 1fr 100px 52px}.app{grid-template-columns:1fr}aside{display:none}.mob-nav{display:block;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}.content{padding:16px}.top{padding:12px 16px;flex-wrap:wrap}.two{grid-template-columns:1fr}}
/* Print */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;font-size:11px}
  body.dark{--bg:#fff;--surface:#fff;--surface2:#f5f5f5;--ink:#000;--mute:#555;--line:#ccc;--acc:#1f5f8b;--accSoft:#e7eff6;--bad:#b3261e;--badSoft:#fbeceb;--ok:#2b7a4b;--okSoft:#e8f3ec;--warn:#97590a;--warnSoft:#fcf0de;--help:#fff8e1;--helpLine:#f0dca0;--helpInk:#5c4a12}
  aside,.top,.mob-nav,.noprint,.x,.toast,.modal-bg{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .tw{max-height:none;overflow:visible;border:none}
  th{position:static}
  input,select,textarea{border:none!important;background:transparent!important;padding:0;-webkit-appearance:none;appearance:none}
  .print-head{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px}
  body.print-all #view{display:none}body.print-all #print-root{display:block}
  .pbreak{break-before:page}
  .tw table{font-size:9px}th,td{padding:3px 5px}.kpis{grid-template-columns:repeat(6,1fr);gap:6px}.kpi{padding:8px}.kpi .v{font-size:15px}.obs{min-width:0}.bars .br{grid-template-columns:150px 1fr 120px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">E</div><div><b>Expensas Claras</b><span>Liquidación transparente</span></div></div>
    <div>
      <div class="side-h">Barrio</div>
      <select class="barrio-pick" id="barrioPick"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot nav" id="navFoot"></div>
  </aside>
  <main>
    <div class="mob-nav"><select id="mobNav"></select></div>
    <div class="top">
      <div><h1 id="topTitle"></h1><div class="sub" id="topSub"></div></div>
      <div class="sp"></div>
      <span class="chip" id="syncChip"><span class="dot"></span><span id="syncTxt">Solo en este navegador</span></span>
      <button class="tbtn" id="btnDona" title="Explica cada concepto en lenguaje simple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>Modo Doña Rosa</button>
      <button class="tbtn" id="btnTheme" title="Modo claro / oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="themeTxt">Oscuro</span></button>
      <button class="tbtn" id="btnPdf" title="Exportar a PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>PDF</button>
    </div>
    <div class="content">
      <div class="print-head"><div><b id="phBarrio"></b><br><span id="phSec"></span></div><div style="text-align:right">Expensas Claras<br><span id="phDate"></span></div></div>
      <div id="view"></div>
      <div id="print-root"></div>
    </div>
  </main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<div class="pop" id="pop"></div>

<script>
/* =========================================================
   Expensas Claras — app de liquidación de expensas
   Datos: localStorage + (opcional) Google Sheets vía Apps Script
   ========================================================= */
const RUBROS=['Seguridad y vigilancia','Personal (sueldos y cargas)','Abonos de servicios','Mantenimiento de partes comunes','Mantenimiento de espacios verdes','Mantenimiento edilicio e instalaciones','Servicios públicos (luz, agua)','Limpieza y residuos','Seguros','Honorarios de administración','Gastos bancarios e impuestos','Obras y mejoras','Otros'];
const KEY='expensas-claras-v1';
const $=id=>document.getElementById(id);
const num=v=>(v===''||v==null||isNaN(+v))?0:+v;
const has=v=>!(v===''||v==null);
const DEC=()=>(typeof D!=='undefined'&&D&&D.cents)?2:0;
const fmt=v=>{if(v==null||v===''||isNaN(v))return '—';const d=DEC(),x=Math.round(+v*10**d)/10**d||0;return x.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/^-/,'−');};
const fmtIn=v=>has(v)&&!isNaN(+v)?(+v).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2}):'';
const parseIn=t=>{t=String(t).trim().replace(/\s|\$/g,'');if(t==='')return '';if(/,/.test(t))t=t.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const x=Number(t);return isNaN(x)?null:x;};
const mIn=(attrs,v,ph='')=>`<input class="n m" type="text" inputmode="decimal" autocomplete="off" ${attrs} value="${fmtIn(v)}" placeholder="${ph}">`;
const nl=v=>num(v).toLocaleString('es-AR');
const money=v=>(v==null||v===''||isNaN(v))?'—':(+v<0?'−$ '+fmt(-v):'$ '+fmt(v));
const pct=v=>(v==null||isNaN(v)||!isFinite(v))?'—':(v*100).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const sg=v=>(v==null||!isFinite(v))?'—':(v>0?'+':'')+pct(v);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const perLabel=p=>{if(!p||!/^\d{4}-\d{2}/.test(p))return p||'';const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][+p.slice(5,7)-1];return m+' '+p.slice(0,4)+p.slice(7);};

/* ---------- Ayuda "Doña Rosa" ---------- */
const HELP={
 inicio:'Acá están todos los barrios que administrás. Tocá uno para entrar y ver sus números.',
 resumen:'Es la <b>foto del mes</b>: cuánto se gastó, cuánto pagaron los vecinos, quién debe y cuánta plata quedó en el banco.',
 A:'<b>Gastos ordinarios</b>: los de todos los meses (seguridad, luz, mantenimiento, honorarios). Se reparten entre todos los lotes.',
 B:'<b>Gastos extraordinarios</b>: los que no son de todos los meses, como una obra o una compra grande. Deberían tener su propia "alcancía" y no mezclarse con la plata de todos los meses.',
 unidades:'Cada fila es un lote. El <b>coeficiente</b> es la porción del barrio que le toca: si un lote tiene 5,67%, paga 5,67 de cada 100 pesos de gasto.',
 gastos:'Todas las facturas del mes, con su comprobante. Un número negativo es una devolución o descuento a favor del barrio.',
 rubros:'Los gastos agrupados por tipo. La <b>variación</b> dice cuánto subió o bajó contra el mes anterior, y la <b>observación</b> explica por qué, en una frase. Es lo primero que pregunta un vecino.',
 prorrateo:'<b>Prorratear</b> es repartir: se toma el total de gastos y se divide según el coeficiente de cada lote. Al que debe del mes anterior se le suma ese saldo y el interés.',
 interes:'El <b>interés por mora</b> es el recargo a quien paga tarde. Se calcula solo sobre lo que se debe, nunca sobre intereses anteriores (eso se llama anatocismo y no corresponde).',
 caja:'La <b>caja</b> es la plata real en el banco. Empieza con un saldo, entra lo que pagan los vecinos y salen los pagos a proveedores. Lo ordinario y lo extraordinario se cuentan por separado.',
 devengado:'<b>Devengado</b> es lo que corresponde al mes aunque todavía no se haya pagado. <b>Pagado</b> es lo que efectivamente salió del banco.',
 controles:'Son <b>alarmas automáticas</b>. No quieren decir que haya un error: avisan dónde conviene pedir el comprobante o una explicación.',
 cuenta:'Lo que tiene que pagar un lote este mes, y de dónde sale cada peso.',
 estadisticas:'Todos los meses juntos: cómo evolucionó cada gasto, cuánto pagó un lote, quién debe hace meses y qué cosas no cierran entre un mes y otro.',
 extra:'Los <b>extraordinarios</b> son gastos fuera de lo común, como una obra. Acá se junta todo lo de la obra de cámaras: qué se cobró, a quién se le pagó, qué tiene factura y qué no, para poder reclamarlo.',
 historial:'Todos los meses ya cerrados, para ver cómo vienen los gastos. Cada mes puede llevar una explicación de qué pasó.',
 morosidad:'<b>Morosidad</b>: qué parte de lo que había que pagar no se pagó. Si es 30%, de cada 100 pesos que se debían, 30 no entraron.',
 fondo:'El <b>fondo de reserva</b> es un ahorro que se separa todos los meses para imprevistos (un portón roto, una bomba quemada), así no hay que pedir plata extra de golpe.',
 ajustes:'Los datos fijos del barrio y los saldos con los que arranca el mes.',

/* ---------- Cálculo ---------- */
function calc(b){
  const c=b.cfg;
  const A=b.gastos.filter(g=>g.tipo!=='B').reduce((s,g)=>s+num(g.imp),0);
  const Bx=b.gastos.filter(g=>g.tipo==='B').reduce((s,g)=>s+num(g.imp),0);
  const fondo=A*num(c.fondo)/100;
  const tc=b.ufs.reduce((s,u)=>s+num(u.coef),0);
  const ti=num(c.interes)/100;
  const rows=b.ufs.map(u=>{
    const p=tc?num(u.coef)/tc:0,ord=A*p,fr=fondo*p,ex=Bx*p,exp=ord+fr+ex;
    const neto=num(u.saldo)-num(u.pagos), cap=Math.max(neto-num(u.intPrev),0), int=cap*ti, part=num(u.part), total=neto+int+exp+part;
    const ref=has(u.ref)?+u.ref:null;
    return {u,p,ord,fr,ex,exp,neto,cap,int,part,total,ref,dif:ref===null?null:total-ref};
  });
  const partT=rows.reduce((s,r)=>s+r.part,0), total=A+Bx+fondo;
  const cobr=b.ufs.reduce((s,u)=>s+num(u.pagos),0), cobrE=num(c.cobrExt), cobrO=cobr-cobrE;
  const egrO=has(c.egrOrd)?+c.egrOrd:A, egrE=has(c.egrExt)?+c.egrExt:Bx;
  const cajaO=num(c.cajaOrd), cajaE=num(c.cajaExt), finO=cajaO+cobrO-egrO, finE=cajaE+cobrE-egrE;
  const exig=b.ufs.reduce((s,u)=>s+Math.max(num(u.saldo),0),0), impago=rows.reduce((s,r)=>s+Math.max(r.neto,0),0);
  const rub={};b.gastos.forEach(g=>{const k=g.rubro||'Otros';rub[k]=rub[k]||{A:0,B:0,items:[]};rub[k][g.tipo==='B'?'B':'A']+=num(g.imp);rub[k].items.push(g);});
  const prev=b.hist.at(-1)||null;
  return {A,B:Bx,fondo,total,partT,rows,tc,cobr,cobrO,cobrE,egrO,egrE,cajaO,cajaE,finO,finE,exig,impago,rub,prev,
    capT:rows.reduce((s,r)=>s+r.cap,0),intT:rows.reduce((s,r)=>s+r.int,0),mora:exig?impago/exig:null,
    totalPagar:rows.reduce((s,r)=>s+r.total,0),fondoFin:num(c.fondoacum)+fondo};
}
function sugerencia(r,C){
  const x=C.rub[r]||{A:0,B:0,items:[]},t=x.A+x.B,pr=C.prev&&C.prev.rubros?C.prev.rubros:null,p=pr?(pr[r]||0):null;
  const neg=x.items.filter(g=>num(g.imp)<0),negT=neg.reduce((s,g)=>s+num(g.imp),0);
  const parts=[];
  if(x.B)parts.push('Incluye extraordinarias: '+(x.items.find(g=>g.tipo==='B')?.prov||'').trim()+'.');
  if(neg.length)parts.push(`Incluye créditos o ajustes por ${money(negT)}.`);
  const pd=x.items.filter(g=>g.pend);if(pd.length)parts.push(`Incluye ${money(pd.reduce((s,g)=>s+num(g.imp),0))} sin explicar.`);
  if(p!==null){if(!p&&t)parts.push('Rubro nuevo este mes.');else if(p&&!t)parts.push('Sin gastos este mes.');else if(p){const v=t/p-1;if(Math.abs(v)<0.02)parts.push('Sin cambios relevantes.');else parts.push(`${v>0?'Aumento':'Baja'} de ${money(Math.abs(t-p))}: explicar el motivo (tarifa, contrato, consumo, facturas de más o de menos).`);}}
  if(!parts.length&&x.items.length===1)parts.push((x.items[0].prov||'').trim()+'.');
  return parts.join(' ');
}
function controles(b,C){
  const out=[],add=(st,t,r)=>out.push({st,t,r}),c=b.cfg;
  add(C.tc>0?'ok':'bad','Coeficientes',C.tc>0?`${b.ufs.length} unidades, normalizadas a 100%.`:'No hay coeficientes cargados.');
  const sO=C.rows.reduce((s,r)=>s+r.ord,0),sE=C.rows.reduce((s,r)=>s+r.ex,0);
  add(Math.abs(sO-C.A)<1&&Math.abs(sE-C.B)<1?'ok':'bad','Prorrateo contra gastos',`Ordinarias ${money(sO)} vs ${money(C.A)} · Extraordinarias ${money(sE)} vs ${money(C.B)}.`);
  const refs=C.rows.filter(r=>r.ref!==null);
  if(refs.length){const big=refs.filter(r=>Math.abs(r.dif)>100);add(big.length?'warn':'ok','Total por lote vs administración',big.length?`${big.length} lote(s) con diferencia mayor a $100: ${big.map(r=>`${esc(r.u.id)} (${r.dif>0?'+':''}${money(r.dif)})`).join(', ')}. El resto, redondeo.`:`Las ${refs.length} unidades coinciden (diferencias menores a $100).`);}
  if(has(c.saldoBanco)){const d=C.finO+C.finE-(+c.saldoBanco);add(Math.abs(d)<10?'ok':'bad','Conciliación bancaria',`Caja calculada ${money(C.finO+C.finE)} vs extracto ${money(+c.saldoBanco)}: diferencia ${money(d)}.`);}
  else add('info','Conciliación bancaria','Cargá el saldo del extracto en Ajustes para conciliar.');
  add(C.finE<-1?'bad':'ok','Fondo extraordinario',C.finE<-1?`Cierra negativo (${money(C.finE)}): se usa plata ordinaria para pagar extraordinarias.`:`Cierra en ${money(C.finE)}.`);
  add(C.finO<-1?'bad':'ok','Fondo ordinario',`Cierra en ${money(C.finO)}.`);
  if(has(c.egrOrd)||has(c.egrExt))add('info','Devengado vs pagado',`Ordinarios: devengado ${money(C.A)}, pagado ${money(C.egrO)}${C.egrO>C.A?' (se pagaron facturas de meses anteriores)':''}. Extraordinarios: devengado ${money(C.B)}, pagado ${money(C.egrE)}${C.B>C.egrE?`; queda una deuda de ${money(C.B-C.egrE)}`:''}.`);
  const neg=b.gastos.filter(g=>num(g.imp)<0);
  if(neg.length)add('warn','Créditos y ajustes',`${neg.length} ítem(s) por ${money(neg.reduce((s,g)=>s+num(g.imp),0))}. Verificar que se cobren o descuenten; si no, bajan la expensa sin entrar plata.`);
  const pend=b.gastos.filter(g=>g.pend);if(pend.length)add('bad','Gastos sin explicar',`${pend.length} gasto(s) por ${money(pend.reduce((s,g)=>s+num(g.imp),0))} marcados como "falta explicar": ${pend.map(g=>esc((g.prov||'').split('—')[0].trim())).join('; ')}.`);
  const sinc=b.gastos.filter(g=>!g.comp||/sin comprobante|ajuste|^factura$/i.test(g.comp));
  add(sinc.length?'warn':'ok','Respaldo documental',sinc.length?`${sinc.length} gasto(s) sin número de comprobante: ${sinc.map(g=>esc((g.prov||'').split('—')[0].trim())).join('; ')}.`:'Todos los gastos tienen comprobante.');
  const deud=C.rows.filter(r=>r.neto>1);
  add(C.mora>0.1&&C.cobr>0?'warn':'ok','Morosidad',`${pct(C.mora)} del exigible: ${money(C.impago)} en ${deud.length} unidad(es)${deud.length?': '+deud.map(r=>esc(r.u.id)).join(', '):''}.`);
  add(num(c.fondo)>0?'ok':'warn','Fondo de reserva',num(c.fondo)>0?`${num(c.fondo)}% de ordinarias; acumulado ${money(C.fondoFin)}.`:'No se constituye fondo de reserva.');
  const bank=b.gastos.filter(g=>g.rubro==='Gastos bancarios e impuestos').reduce((s,g)=>s+num(g.imp),0),hon=b.gastos.filter(g=>g.rubro==='Honorarios de administración').reduce((s,g)=>s+num(g.imp),0);
  if(C.A>0){add(bank/C.A>0.03?'warn':'ok','Gastos bancarios',`${money(bank)} = ${pct(bank/C.A)} de las ordinarias.`);add('info','Honorarios',`${money(hon)} = ${pct(hon/C.A)} de las ordinarias · ${money(b.ufs.length?hon/b.ufs.length:0)} por unidad.`);}
  if(C.prev&&C.prev.A)add(Math.abs(C.A/C.prev.A-1)>0.15?'warn':'ok','Variación de ordinarias',`${sg(C.A/C.prev.A-1)} contra ${perLabel(C.prev.periodo)}. Más de 15% debería explicarse.`);
  const sinObs=Object.keys(C.rub).filter(r=>!b.obs[b.cfg.periodo+'|'+r]);
  add(sinObs.length?'warn':'ok','Observaciones por rubro',sinObs.length?`${sinObs.length} rubro(s) sin explicación: ${sinObs.map(esc).join(', ')}.`:'Todos los rubros tienen su explicación.');
  return out;
}

function tablaRubros(b,C,editable){
  const pr=C.prev&&C.prev.rubros?C.prev.rubros:null,tg=C.A+C.B,P=b.cfg.periodo;
  const allR=[...new Set([...Object.keys(C.rub),...(pr?Object.keys(pr):[])])].sort((x,y)=>((C.rub[y]?.A||0)+(C.rub[y]?.B||0))-((C.rub[x]?.A||0)+(C.rub[x]?.B||0)));
  const pT=pr?Object.values(pr).reduce((s,x)=>s+x,0):null;
  const obsCell=(key,sug)=>editable?`<td><textarea class="obs" rows="1" data-obs="${esc(key)}" placeholder="${esc(sug||'Explicá el motivo en una frase')}">${esc(b.obs[key]||'')}</textarea></td>`:`<td style="font-size:12px">${esc(b.obs[key]||'')||'<span class="muted">—</span>'}</td>`;
  return `<div class="tw"><table><thead><tr><th>Rubro</th><th class="n">Ordinarios</th><th class="n">Extraord.</th><th class="n">Total</th><th class="n">% del total</th><th class="n">Mes anterior</th><th class="n">Variación ${qi('rubros')}</th><th style="min-width:260px">Observaciones</th></tr></thead><tbody>`+
  allR.map(r=>{const a=C.rub[r]?.A||0,x=C.rub[r]?.B||0,t=a+x,p=pr?(pr[r]||0):null,v=p?t/p-1:null;
    return `<tr><td class="nw">${esc(r)}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(x)}</td><td class="n"><b>${fmt(t)}</b></td><td class="n">${tg?pct(t/tg):'—'}</td><td class="n">${p===null?'—':fmt(p)}</td><td class="n ${v>0.0001?'up':v<-0.0001?'down':''}">${p===null?'—':v===null?(t?'nuevo':'—'):sg(v)}</td>${obsCell(P+'|'+r,sugerencia(r,C))}</tr>`;}).join('')+
  `</tbody><tfoot><tr><td>Total gastos</td><td class="n">${fmt(C.A)}</td><td class="n">${fmt(C.B)}</td><td class="n">${fmt(tg)}</td><td class="n">100,00%</td><td class="n">${pT===null?(C.prev?fmt(C.prev.A+C.prev.B):'—'):fmt(pT)}</td><td class="n">${C.prev&&(C.prev.A+C.prev.B)?sg(tg/(C.prev.A+C.prev.B)-1):'—'}</td>${obsCell(P+'|__total','Lectura general del mes')}</tr>`+
  (C.fondo?`<tr><td>Fondo de reserva (${num(b.cfg.fondo)}%)</td><td class="n">${fmt(C.fondo)}</td><td></td><td class="n">${fmt(C.fondo)}</td><td colspan="4"></td></tr>`:'')+`</tfoot></table></div>`+
  (C.prev&&!pr?`<p class="lead mt">El mes anterior (${perLabel(C.prev.periodo)}${C.prev.nota?', '+esc(C.prev.nota):''}) no tiene detalle por rubro: solo se compara el total.</p>`:'');
}

/* ---------- Eventos por vista ---------- */
function colorNeg(root){(root||document).querySelectorAll('td.n, .kpi .v, .bars .amt, .bcard .m b, .recibo td.n').forEach(el=>{const t=(el.innerText||el.textContent).trim().split('\n')[0].trim();el.classList.toggle('neg',/^[−-]\s?\$?\s?[\d.,]*[1-9]/.test(t)&&!/%$/.test(t));});(root||document).querySelectorAll('input.m').forEach(i=>i.classList.toggle('neg',/^\s*[−-]/.test(i.value)));}
function autosize(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function after(v){
  const b=B();document.querySelectorAll('textarea.obs').forEach(autosize);colorNeg();bindTips();
  if(v==='inicio'){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{D.activeId=x.dataset.open;go('resumen');});document.querySelector('[data-new]').onclick=newBarrio;}
  if(!b)return;
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
  on('addUf',()=>{b.ufs.push({id:'Lote '+(b.ufs.length+1),prop:'',coef:100,saldo:0,intPrev:0,pagos:0,part:0,ref:''});touch();render();});
  on('addG',()=>{b.gastos.push({fecha:(b.cfg.periodo||'')+'-01',rubro:(b.gastos.at(-1)||{}).rubro||RUBROS[0],prov:'',comp:'',tipo:'A',imp:0});touch();render();});
  on('fillSug',()=>{const C=calc(b);let n=0;Object.keys(C.rub).forEach(r=>{const k=b.cfg.periodo+'|'+r;if(!b.obs[k]){const s=sugerencia(r,C);if(s){b.obs[k]=s;n++;}}});touch();render();toast(n?`${n} observación(es) completadas: revisalas y ajustalas`:'No había rubros vacíos con sugerencia');});
  on('csv',()=>{const C=calc(b);copy(['Unidad;Propietario;Coeficiente %;Ordinarias;Fondo reserva;Extraordinarias;Expensa del mes;Saldo impago;Interés;Particulares;Total a pagar',...C.rows.map(r=>[r.u.id,r.u.prop,(r.p*100).toFixed(4).replace('.',','),...[r.ord,r.fr,r.ex,r.exp,r.neto,r.int,r.part,r.total].map(x=>Math.round(x))].join(';'))].join('\n'),'Prorrateo copiado: pegalo en Google Sheets');});
  on('closeP',closePeriod);
  on('copyRec',()=>copy(reciboTxt(b,window._uf||0),'Estado de cuenta copiado'));
  on('pdfAll',()=>printAll('cuentas'));
  on('pdfExtra',()=>{$('phSec').textContent='Informe de extraordinarias';printNow();});
  on('copyPreg',()=>copy([...document.querySelectorAll('#view ol li')].map((li,i)=>(i+1)+'. '+li.textContent).join('\n'),'Preguntas copiadas'));
  const sp=$('smPick');if(sp)sp.onchange=()=>{window._sm=+sp.value;render();};
  const up=$('ufPick');if(up)up.onchange=()=>{window._uf=+up.value;render();};
  const gf=$('gFilter');if(gf)gf.oninput=()=>{window._gf=gf.value;soft();};
  const op=$('obsPeriodo');if(op)op.oninput=()=>{b.cfg.obsPeriodo=op.value;touch();};
  on('addR',()=>nuevoRubro(null));
  document.querySelectorAll('[data-delr]').forEach(x=>x.onclick=()=>{const k=+x.dataset.delr,r=b.rubros[k];if(b.gastos.some(g=>g.rubro===r)){toast('Hay gastos con ese rubro: cambialos antes de quitarlo');return;}b.rubros.splice(k,1);touch();render();});
  on('expB',()=>copy(JSON.stringify(b,null,1),'Datos del barrio copiados'));
  on('impB',()=>{const t=$('ioB');if(t.style.display==='none'){t.style.display='block';t.focus();return;}try{const d=JSON.parse(t.value);if(!d.cfg||!Array.isArray(d.ufs))throw 0;d.id=b.id;Object.assign(b,d);touch();render();toast('Barrio importado');}catch(e){toast('El texto no es un barrio válido');}});
  on('dupB',()=>{const c=JSON.parse(JSON.stringify(b));c.id=uid();c.nombre=b.nombre+' (copia)';D.barrios.push(c);D.activeId=c.id;persist();queueSync(c);go('ajustes');toast('Barrio duplicado');});
  on('delB',()=>{const e=$('delB');if(!e.dataset.arm){e.dataset.arm=1;e.textContent='Confirmar: eliminar '+b.nombre;setTimeout(()=>{if(e.isConnected){delete e.dataset.arm;e.textContent='Eliminar barrio';}},4000);return;}
    const id=b.id;D.barrios=D.barrios.filter(x=>x.id!==id);D.activeId=D.barrios[0]?.id||null;persist();apiDelete(id);go('inicio');toast('Barrio eliminado');});
  if(v==='conexion')bindConexion();
}
function bindConexion(){
  const msg=t=>{const m=$('apiMsg');if(m)m.textContent=t;};
  $('prefCents').onchange=e=>{D.cents=e.target.checked;persist();render();};
  $('apiUrl').oninput=e=>{D.api.url=e.target.value.trim();persist();syncChip();};
  $('apiTok').oninput=e=>{D.api.token=e.target.value;persist();};
  $('apiAuto').onchange=e=>{D.api.auto=e.target.checked;persist();};
  $('apiTest').onclick=async()=>{msg('Probando…');try{const r=await apiGet('ping');msg(r.ok?`Conectado. La planilla tiene ${r.barrios} barrio(s).`:'Respuesta inesperada: '+(r.error||''));setSync(r.ok?'ok':'bad');}catch(e){msg(errMsg(e));setSync('bad');}};
  $('apiPull').onclick=async()=>{msg('Trayendo datos…');try{const r=await apiGet('load');if(!r.ok)throw new Error(r.error);if(!r.barrios.length){msg('La planilla está vacía. Usá "Subir todo".');return;}const n=mergeRemote(r.barrios,true);msg(`Listo: ${r.barrios.length} barrio(s) en la planilla; ${n} actualizado(s) en este navegador.`);setSync('ok');shell();}catch(e){msg(errMsg(e));setSync('bad');}};
  $('apiPush').onclick=async()=>{msg('Subiendo…');try{for(const b of D.barrios){const r=await apiPost({action:'saveBarrio',barrio:b});if(!r.ok)throw new Error(r.error);}msg(`Listo: ${D.barrios.length} barrio(s) guardados en la planilla.`);setSync('ok');}catch(e){msg(errMsg(e));setSync('bad');}};
  $('expAll').onclick=()=>copy(JSON.stringify({v:1,barrios:D.barrios},null,1),'Respaldo copiado');
  $('impAll').onclick=()=>{const t=$('ioAll');if(t.style.display==='none'){t.style.display='block';t.focus();return;}try{const d=JSON.parse(t.value);if(!Array.isArray(d.barrios))throw 0;d.barrios.forEach(nb=>{const i=D.barrios.findIndex(x=>x.id===nb.id);if(i>=0)D.barrios[i]=nb;else D.barrios.push(nb);});D.activeId=d.barrios[0]?.id||D.activeId;persist();if(D.api.url&&D.api.auto)d.barrios.forEach(x=>apiPost({action:'saveBarrio',barrio:x}).then(r=>setSync(r.ok?'ok':'bad')).catch(()=>setSync('bad')));render();toast(d.barrios.length+' barrio(s) importados');}catch(e){toast('El texto no es un respaldo válido');}};
  $('resetAll').onclick=e=>{const x=e.target;if(!x.dataset.arm){x.dataset.arm=1;x.textContent='Confirmar: se borran los datos de este navegador';setTimeout(()=>{if(x.isConnected){delete x.dataset.arm;x.textContent='Volver a los datos de ejemplo';}},4000);return;}const api=D.api;D=initial();D.api=api;D.view='inicio';persist();render();toast('Datos de ejemplo cargados');};
}

/* ---------- Edición de celdas ---------- */
document.addEventListener('input',e=>{const t=e.target,b=B();if(!b)return;const d=t.dataset;
  const isM=t.classList.contains('m'),pv=isM?parseIn(t.value):null;if(isM)t.classList.toggle('neg',/^\s*[−-]/.test(t.value));
  if(isM&&pv===null){t.style.borderColor='var(--bad)';return;}else if(isM)t.style.borderColor='';
  if(d.u!==undefined){b.ufs[+d.u][d.f]=isM?pv:t.value;touch();soft();}
  else if(d.g!==undefined&&t.type==='checkbox'){b.gastos[+d.g][d.f]=t.checked;touch();soft();}
  else if(d.g!==undefined&&t.tagName!=='SELECT'){b.gastos[+d.g][d.f]=isM?(pv===''?0:pv):t.value;touch();soft();}
  else if(d.c!==undefined){b.cfg[d.c]=isM?pv:t.value;touch();soft();}
  else if(d.b!==undefined){b[d.b]=t.value;touch();soft();}
  else if(d.pres!==undefined){if(pv!==null){b.presupuestos[+d.pres][d.pf]=pv===''?0:pv;touch();soft();}}
  else if(d.obs!==undefined){autosize(t);if(t.value)b.obs[d.obs]=t.value;else delete b.obs[d.obs];touch();}
  else if(d.hobs!==undefined){autosize(t);b.hist[+d.hobs].obs=t.value;touch();}
});
document.addEventListener('change',e=>{const t0=e.target;if(t0.classList&&t0.classList.contains('m')){const v=parseIn(t0.value);if(v!==null)t0.value=fmtIn(v);}});
document.addEventListener('change',e=>{const t=e.target,b=B();if(b&&t.tagName==='SELECT'&&t.dataset.g!==undefined&&t.value==='__new'){nuevoRubro(+t.dataset.g);return;}if(b&&t.tagName==='SELECT'&&t.dataset.g!==undefined){b.gastos[+t.dataset.g][t.dataset.f]=t.value;touch();render();}});
document.addEventListener('click',e=>{const q=e.target.closest('.qi'),pop=$('pop');
  if(q){e.stopPropagation();const k=q.dataset.help;if(pop.style.display==='block'&&pop.dataset.k===k){pop.style.display='none';return;}
    pop.innerHTML=HELP[k]||'';pop.dataset.k=k;pop.style.display='block';const r=q.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
    let x=Math.min(Math.max(8,r.left-w/2+8),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;pop.style.left=x+'px';pop.style.top=y+'px';return;}
  if(!e.target.closest('#pop'))pop.style.display='none';},true);
document.addEventListener('scroll',()=>{$('pop').style.display='none';},true);
document.addEventListener('click',e=>{const ev=e.target.closest('[data-ev]');if(ev){window._evMode=ev.dataset.ev;render();return;}});
document.addEventListener('click',e=>{const nv=e.target.closest('[data-v]');if(nv){e.preventDefault();go(nv.dataset.v);return;}});
document.addEventListener('click',e=>{const t=e.target,b=B();if(!b)return;
  if(t.dataset.delu!==undefined){b.ufs.splice(+t.dataset.delu,1);touch();render();}
  if(t.dataset.delg!==undefined){b.gastos.splice(+t.dataset.delg,1);touch();render();}});
let tmr;function soft(){clearTimeout(tmr);tmr=setTimeout(()=>{const a=document.activeElement,ds=a&&a.dataset?{...a.dataset}:{},id=a&&a.id,ss=a&&a.selectionStart,raw=a&&a.value;
  shell();$('view').innerHTML=viewHTML(D.view);after(D.view);
  let q=null;const k=Object.keys(ds).find(x=>['u','g','c','b','pres'].includes(x));
  if(k)q=document.querySelector(`[data-${k}="${ds[k]}"]${ds.f?`[data-f="${ds.f}"]`:''}${ds.pf?`[data-pf="${ds.pf}"]`:''}`);else if(id)q=$(id);
  if(q){if(raw!=null&&q.tagName==='INPUT')q.value=raw;q.focus();try{if(ss!=null)q.setSelectionRange(ss,ss);}catch(_){}}},600);}

/* ---------- Barrio nuevo / cierre ---------- */
function newBarrio(){
  modal(`<h3>Nuevo barrio</h3><div class="grid"><div style="grid-column:1/-1"><label>Nombre</label><input id="nbNom" placeholder="Ej.: Barrio Los Álamos"></div><div><label>Zona</label><input id="nbZona" placeholder="Ej.: Pilar"></div><div><label>CUIT del consorcio</label><input id="nbCuit"></div><div><label>Cantidad de unidades</label><input id="nbN" type="number" class="n" value="20"></div><div><label>Primer período</label><input id="nbPer" type="month" value="${new Date().toISOString().slice(0,7)}"></div><div><label>Interés por mora (% mensual)</label><input id="nbInt" type="number" class="n" value="3"></div><div><label>Fondo de reserva (%)</label><input id="nbFr" type="number" class="n" value="5"></div></div><p class="lead mt">Se crean las unidades con el mismo coeficiente; después las ajustás en Unidades.</p><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" id="nbCancel">Cancelar</button><button class="btn" id="nbOk">Crear barrio</button></div>`);
  $('nbNom').focus();$('nbCancel').onclick=closeModal;
  $('nbOk').onclick=()=>{const nom=$('nbNom').value.trim();if(!nom){$('nbNom').focus();return;}const n=Math.max(1,Math.min(500,+$('nbN').value||1)),per=$('nbPer').value;
    const b={id:uid(),nombre:nom,zona:$('nbZona').value.trim(),admin:'',cfg:{...blankCfg(),cuit:$('nbCuit').value.trim(),periodo:per,venc:per+'-10',interes:+$('nbInt').value||0,fondo:+$('nbFr').value||0},
      ufs:Array.from({length:n},(_,i)=>({id:'Lote '+(i+1),prop:'',coef:100,saldo:0,intPrev:0,pagos:0,part:0,ref:''})),gastos:[],hist:[],obs:{},updated:new Date().toISOString()};
    D.barrios.push(b);D.activeId=b.id;persist();queueSync(b);closeModal();go('unidades');toast('Barrio creado: cargá unidades y gastos');};
}
function nuevoRubro(gi){const b=B();
  modal(`<h3>Nuevo rubro</h3><label>Nombre del rubro</label><input id="nrNom" placeholder="Ej.: Iluminación de calles"><p class="lead mt">Queda disponible para todos los gastos de ${esc(b.nombre)}.</p><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" id="nrNo">Cancelar</button><button class="btn" id="nrOk">Agregar rubro</button></div>`);
  const inp=$('nrNom');inp.focus();
  const ok=()=>{const n=inp.value.trim().replace(/\s+/g,' ');if(!n){inp.focus();return;}const ex=rubroList(b).find(r=>r.toLowerCase()===n.toLowerCase());const name=ex||n;
    if(!ex){b.rubros=b.rubros||[];b.rubros.push(name);}if(gi!=null&&b.gastos[gi])b.gastos[gi].rubro=name;touch();closeModal();render();toast(ex?'Ese rubro ya existía: quedó seleccionado':'Rubro "'+name+'" agregado');};
  $('nrOk').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok();};$('nrNo').onclick=()=>{closeModal();render();};}
function closePeriod(){
  const b=B(),C=calc(b),c=b.cfg;
  modal(`<h3>Cerrar ${perLabel(c.periodo)}</h3><p>Se guarda la liquidación en el historial y se arma el mes siguiente:</p><ul style="margin:0 0 10px 18px;padding:0;font-size:13px;line-height:1.7"><li>El total a pagar de cada unidad pasa a ser su saldo anterior (los intereses quedan separados).</li><li>Pagos, particulares y gastos quedan en cero.</li><li>Los fondos ordinario (${money(C.finO)}) y extraordinario (${money(C.finE)}) pasan como saldo inicial.</li></ul>${Object.keys(C.rub).some(r=>!b.obs[c.periodo+'|'+r])?'<p class="help" style="display:block">Hay rubros sin observación. Conviene completarlos antes de cerrar.</p>':''}<div class="row mt" style="justify-content:flex-end"><button class="btn ghost" id="cpNo">Cancelar</button><button class="btn" id="cpOk">Cerrar período</button></div>`);
  $('cpNo').onclick=closeModal;
  $('cpOk').onclick=()=>{const rub={};Object.entries(C.rub).forEach(([k,v])=>rub[k]=v.A+v.B);
    b.hist.push({periodo:c.periodo,cobrosNoId:c.cobrosNoId||null,gastos:b.gastos.map(g=>({rubro:g.rubro,prov:g.prov,tipo:g.tipo,imp:num(g.imp),pend:!!g.pend})),ufs:snapUfs(C),cajaIniOrd:C.cajaO,cajaIniExt:C.cajaE,A:C.A,B:C.B,fondo:C.fondo,part:C.partT,total:C.total,cobranza:C.cobr,mora:C.mora,cajaOrd:C.finO,cajaExt:C.finE,rubros:rub,obs:b.obs[c.periodo+'|__total']||''});
    C.rows.forEach(r=>{r.u.intPrev=Math.round(Math.max(Math.min(num(r.u.intPrev),r.neto),0)+r.int);r.u.saldo=Math.round(r.total);r.u.pagos=0;r.u.part=0;r.u.ref='';});
    c.cajaOrd=Math.round(C.finO*100)/100;c.cajaExt=Math.round(C.finE*100)/100;c.fondoacum=Math.round(C.fondoFin);
    Object.assign(c,{cobrExt:'',egrOrd:'',egrExt:'',saldoBanco:'',obsPeriodo:'',cobrosNoId:null});
    const [y,m]=(c.periodo||'2026-01').split('-').map(Number),nx=new Date(y,m,1);c.periodo=nx.getFullYear()+'-'+String(nx.getMonth()+1).padStart(2,'0');c.venc=c.periodo+'-10';
    b.gastos=[];touch();closeModal();go('historial');toast('Período cerrado');};
}
function reciboTxt(b,i){const C=calc(b),r=C.rows[i],c=b.cfg;
  return `${b.nombre} — ${r.u.id}${r.u.prop?' ('+r.u.prop+')':''}\n${perLabel(c.periodo)} · Vence ${c.venc}\n\nSaldo anterior: ${money(r.u.saldo)}\nPagos registrados: -${money(r.u.pagos)}\nInterés por mora: ${money(r.int)}\nExpensas ordinarias: ${money(r.ord)}\n${r.fr?'Fondo de reserva: '+money(r.fr)+'\n':''}Expensas extraordinarias: ${money(r.ex)}\n${r.part?'Gastos particulares: '+money(r.part)+'\n':''}TOTAL A PAGAR: ${money(r.total)}`;}

/* ---------- PDF ---------- */
function printNow(){try{window.print();}catch(e){}setTimeout(()=>toast('Si no se abrió el diálogo de impresión, abrí la app publicada en GitHub Pages: la vista previa de Claude no permite imprimir.'),600);}
function printAll(kind){const b=B();if(!b){printNow();return;}const C=calc(b);let h='';
  if(kind==='cuentas')h=b.ufs.map((u,i)=>`<div class="${i?'pbreak':''}">${reciboHTML(b,C,i)}</div>`).join('');
  else h=`<h2 style="margin:0 0 10px">Informe del período</h2>`+vResumen(b,C)+`<div class="pbreak"></div>`+vLiquidacion(b,C,true)+`<div class="pbreak"></div>`+vCaja(b,C)+vControles(b,C).replace(/<textarea[^>]*>([\s\S]*?)<\/textarea>/,(m,t)=>`<div style="white-space:pre-wrap;font-size:12px">${t}</div>`)+`<div class="pbreak"></div>`+vHistorial(b,C);
  $('print-root').innerHTML=h;document.body.classList.add('print-all');$('phSec').textContent=kind==='cuentas'?'Estados de cuenta':'Informe completo';
  const done=()=>{document.body.classList.remove('print-all');$('print-root').innerHTML='';window.removeEventListener('afterprint',done);};window.addEventListener('afterprint',done);printNow();setTimeout(done,4000);}
function pdfMenu(){const b=B(),isB=b&&!GLOBAL.some(x=>x[0]===D.view);
  modal(`<h3>Exportar a PDF</h3><p class="lead">Se abre el diálogo de impresión: elegí "Guardar como PDF".</p><div style="display:grid;gap:8px"><button class="btn ghost" id="pdf1">Esta pantalla</button>${isB?`<button class="btn ghost" id="pdf2">Informe completo del período (resumen, rubros, prorrateo, caja, controles, historial)</button><button class="btn ghost" id="pdf3">Estados de cuenta de todas las unidades (uno por hoja)</button>`:''}</div><div class="row mt" style="justify-content:flex-end"><button class="btn ghost" id="pdfX">Cerrar</button></div>`);
  $('pdfX').onclick=closeModal;$('pdf1').onclick=()=>{closeModal();setTimeout(printNow,150);};
  if(isB){$('pdf2').onclick=()=>{closeModal();setTimeout(()=>printAll('informe'),150);};$('pdf3').onclick=()=>{closeModal();setTimeout(()=>printAll('cuentas'),150);};}}

/* ---------- Google Sheets (Apps Script) ---------- */
let syncState='local',syncT;
function setSync(s){syncState=s;syncChip();}
function syncChip(){const ch=$('syncChip'),t=$('syncTxt');ch.className='chip'+(syncState==='ok'?' ok':syncState==='bad'?' bad':'');
  t.textContent=!D.api.url?'Solo en este navegador':syncState==='ok'?'Guardado en Google Sheets':syncState==='bad'?'Sin conexión con la planilla':syncState==='saving'?'Guardando…':'Google Sheets';}
const errMsg=e=>'No se pudo conectar ('+(e&&e.message||e)+'). Revisá la URL y la clave. Desde la vista previa de Claude no funciona: usá la app publicada en GitHub Pages.';
async function apiGet(action){const u=D.api.url+(D.api.url.includes('?')?'&':'?')+'action='+action+'&token='+encodeURIComponent(D.api.token);const r=await fetch(u);return r.json();}
async function apiPost(body){const r=await fetch(D.api.url,{method:'POST',body:JSON.stringify({...body,token:D.api.token})});return r.json();}
function queueSync(b){if(!D.api.url||!D.api.auto)return;const target=b||B();if(!target)return;clearTimeout(syncT);setSync('saving');
  syncT=setTimeout(async()=>{try{const r=await apiPost({action:'saveBarrio',barrio:target});setSync(r.ok?'ok':'bad');}catch(e){setSync('bad');}},1800);}
function mergeRemote(list,force){let n=0;list.forEach(rb=>{const i=D.barrios.findIndex(x=>x.id===rb.id);if(i<0){D.barrios.push(rb);n++;}else if(force||(rb.updated&&(!D.barrios[i].updated||rb.updated>D.barrios[i].updated))){D.barrios[i]=rb;n++;}});if(!B()&&D.barrios[0])D.activeId=D.barrios[0].id;persist();return n;}
async function autoLoad(){if(!D.api.url)return;try{const r=await apiGet('load');if(r.ok){const n=mergeRemote(r.barrios,false);setSync('ok');if(n){render();toast(n+' barrio(s) actualizados desde Google Sheets');}}else setSync('bad');}catch(e){setSync('bad');}}
async function apiDelete(id){if(!D.api.url)return;try{await apiPost({action:'deleteBarrio',id});}catch(e){}}

/* ---------- Utilidades ---------- */
function modal(h){$('modal').innerHTML=h;$('modalBg').classList.add('on');}
function closeModal(){$('modalBg').classList.remove('on');}
$('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200);}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copiado');}catch(e){modal(`<h3>Copiá el texto</h3><textarea rows="12" style="font-family:ui-monospace,monospace;font-size:12px">${esc(t)}</textarea><div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Listo</button></div>`);}}

/* ---------- Arranque ---------- */
$('btnTheme').onclick=()=>{D.theme=D.theme==='dark'?'light':'dark';persist();shell();};
$('btnDona').onclick=()=>{D.dona=!D.dona;persist();shell();toast(D.dona?'Modo Doña Rosa: cada sección explica sus conceptos en lenguaje simple':'Modo Doña Rosa desactivado');};
$('btnPdf').onclick=pdfMenu;
$('barrioPick').onchange=e=>{if(e.target.value==='__new'){shell();newBarrio();return;}D.activeId=e.target.value;persist();go(GLOBAL.some(x=>x[0]===D.view)?'resumen':D.view);};
$('mobNav').onchange=e=>go(e.target.value);
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if([...VIEWS,...GLOBAL].some(x=>x[0]===k)&&k!==D.view)go(k);});
load();const h0=location.hash.slice(1);if([...VIEWS,...GLOBAL].some(x=>x[0]===h0))D.view=h0;render();
if(D.api.url){setSync('idle');autoLoad();}
</script>
